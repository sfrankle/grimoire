name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.331
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            claude plugin validate "$dir"
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

  tests:
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run each plugin's tests/run.sh
        run: |
          shopt -s nullglob
          for suite in plugins/*/tests/run.sh; do
            echo "::group::$suite"
            bash "$suite"
            echo "::endgroup::"
          done

  version-bump:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/ci/check-version-bump.sh "origin/${{ github.base_ref }}"

  privacy:
    name: Privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/check-privacy.sh
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - run: ./actionlint -color
